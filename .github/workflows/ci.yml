name: Build and test CPU

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  correctness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        precision: ['ON', 'OFF']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNBODY_NATIVE=OFF -DNBODY_USE_FLOAT=${{ matrix.precision }}
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  without-openmp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cmake -S . -B build -DNBODY_NATIVE=OFF -DCMAKE_DISABLE_FIND_PACKAGE_OpenMP=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
